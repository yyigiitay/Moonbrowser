name: MoonBrowser APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: ZIP ac
        run: |
          unzip -q MoonBrowser-1.zip -d source
          PROJECT=$(find source -type f -name gradlew -print -quit)
          test -n "$PROJECT"
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"
      - name: APK derle
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MoonBrowser-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
